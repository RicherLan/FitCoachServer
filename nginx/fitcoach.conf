# ============================================================
# FitCoach Server — Nginx 反代配置
#
# 职责：
#   1. /api/**           → app:8080  （动态接口）
#   2. /static/**        → 本地静态文件直读（用户上传的头像/反馈附件）
#   3. /assets/**        → app:8080  （classpath 内置资源，如默认头像）
#   4. /swagger-ui /v3   → app:8080  （生产 SPRINGDOC_ENABLED=true 时才用，建议加 Basic Auth）
#   5. HTTPS 重定向（HTTP→HTTPS）  ← 申请到证书后启用 ssl block
#   6. gzip 压缩
#   7. 限流（防 OTP 接口被刷）
#
# 申请 SSL 证书（Let's Encrypt 免费）：
#   1. 域名解析到服务器 IP
#   2. apt install certbot
#   3. certbot certonly --standalone -d api.example.com
#   4. 证书路径：/etc/letsencrypt/live/api.example.com/{fullchain,privkey}.pem
#   5. 把证书目录映射到 SSL_CERT_DIR（.env.prod 配置）
#   6. 修改下面 ssl_certificate 路径并启用 443 server block
# ============================================================

# ====== 限流：防接口被刷 ======
# zone=otp 用于 OTP/captcha 等高敏接口，每 IP 每秒最多 1 个请求
# zone=api 用于普通业务接口，每 IP 每秒 20 个
limit_req_zone $binary_remote_addr zone=otp:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# 上游：app 是 compose 服务名，docker 内部 DNS 自动解析
upstream fitcoach_app {
    server app:8080;
    keepalive 32;
}

# ====== 主 server：HTTP 80 ======
# 上线后建议改成「301 全量跳 HTTPS」：去掉下方所有 location，只保留 return 301
server {
    listen 80;
    server_name _;

    # 上线启用 HTTPS 后取消注释，所有 HTTP 流量强制跳 HTTPS
    # return 301 https://$host$request_uri;

    # === 全局 ===
    charset utf-8;
    client_max_body_size 60M;            # 与 server 端 multipart.max-file-size 一致
    client_body_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # 真实 IP 透传（让 server 端拿到客户端 IP，而不是 nginx 的 IP）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # === gzip 压缩 ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # === 健康检查（云厂商 LB 用）===
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # === OTP / 短信 / 验证码相关接口：严格限流 ===
    location ~ ^/api/(otp|captcha|sms)/ {
        limit_req zone=otp burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://fitcoach_app;
    }

    # === 静态资源（用户上传）：nginx 直读，不打扰 Spring ===
    # 性能更好，省 8080 一次反代往返
    location /static/ {
        alias /usr/share/nginx/uploads/;
        # 缓存 7 天（头像基本不改）
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 不缓存 404，避免上传过程中的临时空窗
        try_files $uri =404;
    }

    # === 业务接口（动态） ===
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://fitcoach_app;
    }

    # === classpath 内置资源（默认头像等） ===
    location /assets/ {
        proxy_pass http://fitcoach_app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # === Swagger（生产默认 SPRINGDOC_ENABLED=false 时这两个路径会 404） ===
    # 临时排查打开时，强烈建议加 Basic Auth：
    #   auth_basic "FitCoach Admin";
    #   auth_basic_user_file /etc/nginx/.htpasswd;
    location /swagger-ui {
        proxy_pass http://fitcoach_app;
    }
    location /v3/api-docs {
        proxy_pass http://fitcoach_app;
    }

    # === 根路径：暂时返回提示（未来可放 admin 前端的 dist） ===
    location / {
        return 200 "FitCoach Server is running. Visit /api/auth/ping for health check.\n";
        add_header Content-Type text/plain;
    }

    # === 屏蔽常见探测路径（减少日志噪音 + 抵御扫描器） ===
    location ~ /\.(env|git|svn|ht) {
        deny all;
        return 404;
    }
    location ~ \.(php|asp|aspx|jsp)$ {
        return 404;
    }
}

