# ============================================================
# FitCoach Server — Nginx 反代配置
#
# 职责：
#   1. /api/**           → app:8080  （动态接口）
#   2. /static/**        → 本地静态文件直读（用户上传的头像/反馈附件）
#   3. /assets/**        → app:8080  （classpath 内置资源，如默认头像）
#   4. /swagger-ui /v3   → app:8080  （生产 SPRINGDOC_ENABLED=true 时才用，建议加 Basic Auth）
#   5. HTTP 80 → 301 HTTPS（保留 certbot 验证路径）
#   6. HTTPS 443 终止 + gzip 压缩
#   7. www.migofitai.com → 301 migofitai.com（裸域为主）
#   8. 限流（防 OTP 接口被刷）
#
# SSL 证书（Let's Encrypt / certbot）：
#   首次申请：certbot standalone（需临时停 nginx 容器释放 80 端口）
#   自动续期：certbot webroot（不停服务，通过 /.well-known/acme-challenge/ 验证）
#   详见 doc/DEPLOY.md 第 5 节
# ============================================================

# ====== 限流：防接口被刷 ======
limit_req_zone $binary_remote_addr zone=otp:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# 上游：app 是 compose 服务名，docker 内部 DNS 自动解析
upstream fitcoach_app {
    server app:8080;
    keepalive 32;
}

# ====== HTTP 80：301 跳 HTTPS + certbot 验证 ======
server {
    listen 80;
    server_name migofitai.com www.migofitai.com;

    # Let's Encrypt certbot webroot 验证（续期时用，不停服务）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/certbot;
    }

    # 其他所有 HTTP 流量强制跳 HTTPS
    location / {
        return 301 https://migofitai.com$request_uri;
    }
}

# ====== HTTPS www → 裸域 301 ======
server {
    listen 443 ssl http2;
    server_name www.migofitai.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://migofitai.com$request_uri;
}

# ====== HTTPS 443：主服务 ======
server {
    listen 443 ssl http2;
    server_name migofitai.com;

    # --- SSL 证书 ---
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # --- 现代 TLS 配置（A+ 评级） ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — 强制浏览器只走 HTTPS（上线稳定运行一段时间后可开启）
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # === 全局 ===
    charset utf-8;
    client_max_body_size 210M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 真实 IP 透传
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # === gzip 压缩 ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # === 健康检查（云厂商 LB 用）===
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # === OTP / 短信 / 验证码相关接口：严格限流 ===
    location ~ ^/api/(otp|captcha|sms)/ {
        limit_req zone=otp burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://fitcoach_app;
    }

    # === 静态资源（用户上传）：nginx 直读，不打扰 Spring ===
    location /static/ {
        alias /usr/share/nginx/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # === 业务接口（动态） ===
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://fitcoach_app;
    }

    # === /assets/ 路径双源：先看官网静态资源，找不到再回退到后端 ===
    location /assets/ {
        root /usr/share/nginx/website;
        try_files $uri @app_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location @app_assets {
        proxy_pass http://fitcoach_app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # === Swagger（生产默认关闭） ===
    location /swagger-ui {
        proxy_pass http://fitcoach_app;
    }
    location /v3/api-docs {
        proxy_pass http://fitcoach_app;
    }

    # === 根路径：MIGO FIT 官方网站（静态站）===
    location / {
        root /usr/share/nginx/website;
        index index.html;
        try_files $uri $uri/ $uri.html /index.html;

        location ~* \.(css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            root /usr/share/nginx/website;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }
        location ~* \.html$ {
            root /usr/share/nginx/website;
            add_header Cache-Control "no-cache, must-revalidate";
            expires 0;
        }
    }

    # === 屏蔽常见探测路径 ===
    location ~ /\.(env|git|svn|ht) {
        deny all;
        return 404;
    }
    location ~ \.(php|asp|aspx|jsp)$ {
        return 404;
    }
}
