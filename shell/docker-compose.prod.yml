# ============================================================
# FitCoach Server — 生产环境编排
#
# 编排 3 个服务：
#   - mysql    : MySQL 8.0 主数据库
#   - app      : Spring Boot 应用（从 ../Dockerfile 构建或拉远端镜像）
#   - nginx    : 反向代理 + 静态资源 + HTTPS 终止
#
# 使用方式（在项目根目录执行）：
#   1. 准备环境变量：cp .env.prod.example .env.prod && 编辑
#   2. 启动：docker compose --env-file .env.prod -f shell/docker-compose.prod.yml up -d
#   3. 查看：docker compose -f shell/docker-compose.prod.yml ps
#   4. 日志：docker compose -f shell/docker-compose.prod.yml logs -f app
#   5. 停止：docker compose -f shell/docker-compose.prod.yml down
#
# 数据持久化（宿主机路径，重启容器数据不丢）：
#   - /data/fitcoach/mysql    → MySQL 数据
#   - /data/fitcoach/uploads  → 用户上传的头像/反馈附件
#   - /data/fitcoach/logs     → 应用日志
#   - /data/fitcoach/certs    → SSL 证书（certbot 申请）
#
# 网络拓扑：
#   宿主机 :80/:443
#       └─→ nginx (容器)
#               ├─→ /api/**  → app:8080 (容器内网)
#               ├─→ /static/** /assets/** → app:8080
#               └─→ /        → admin 静态资源（未来扩展）
#       app ──→ mysql:3306 (容器内网，不暴露到宿主机)
# ============================================================

version: '3.8'

services:
  # =================== MySQL ===================
  mysql:
    image: mysql:8.0
    container_name: fitcoach-mysql-prod
    restart: unless-stopped
    # 生产 MySQL 端口不暴露到公网，只允许同 network 的 app 容器连
    # 如需在宿主机用客户端连，临时加：ports: ["127.0.0.1:3306:3306"]
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fitcoach}
      MYSQL_USER: ${MYSQL_USER:-fitcoach}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ${MYSQL_DATA_DIR:-/data/fitcoach/mysql}:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      # 生产建议开慢查询日志（仅本地排查时打开，平时关掉避免磁盘占满）
      # - --slow-query-log=1
      # - --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fitcoach-net

  # =================== Spring Boot 应用 ===================
  app:
    # 默认从本地 Dockerfile 构建；上线后建议改成 image 拉取镜像仓库的版本（CI 推上去的）
    build:
      context: ..
      dockerfile: Dockerfile
    image: fitcoach-server:${APP_VERSION:-latest}
    container_name: fitcoach-app-prod
    restart: unless-stopped
    # 不直接暴露 8080，只让 nginx 通过内网访问
    expose:
      - "8080"
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}

      # 数据库（host 用 compose 服务名 mysql，走内网 DNS）
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # JPA schema 策略：默认 validate（严格校验），首次部署/加表时临时设 update
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}

      # Admin 默认密码逃生开关：首次部署 admin/admin123 还没改 → 必须设 true 才能启动；
      # 登录后改密码 → 立刻关回 false，避免长期允许默认密码
      ADMIN_ALLOW_DEFAULT_PASSWORD: ${ADMIN_ALLOW_DEFAULT_PASSWORD:-false}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # JVM
      JAVA_OPTS: ${JAVA_OPTS}

      # Swagger
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}

      # 上传
      UPLOAD_BASE_DIR: ${UPLOAD_BASE_DIR:-/app/uploads}
      UPLOAD_URL_PREFIX: ${UPLOAD_URL_PREFIX:-/static}
      UPLOAD_DEFAULT_AVATAR_URL: ${UPLOAD_DEFAULT_AVATAR_URL:-/assets/default-avatar.svg}

      # 短信
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_SMS_APP_ID: ${TENCENT_SMS_APP_ID:-}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-FitCoach}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION:-ap-guangzhou}

      # 验证码
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_APP_ID: ${CAPTCHA_APP_ID:-}
      CAPTCHA_APP_SECRET_KEY: ${CAPTCHA_APP_SECRET_KEY:-}

      TZ: Asia/Shanghai

    volumes:
      # 上传文件持久化（用户头像、反馈附件、日志 zip）
      - ${UPLOAD_DATA_DIR:-/data/fitcoach/uploads}:/app/uploads
      # 应用日志持久化（OOM 时的 heap dump 也在这）
      - ${APP_LOG_DIR:-/data/fitcoach/logs}:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/auth/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - fitcoach-net

  # =================== Nginx 反代 ===================
  nginx:
    image: nginx:1.27-alpine
    container_name: fitcoach-nginx-prod
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # 主配置（按需挂载片段，避免动整个 nginx.conf）
      - ../nginx/fitcoach.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书（用 certbot 申请 Let's Encrypt 后放这里）
      - ${SSL_CERT_DIR:-/data/fitcoach/certs}:/etc/nginx/certs:ro
      # nginx 自身日志
      - ${NGINX_LOG_DIR:-/data/fitcoach/logs/nginx}:/var/log/nginx
      # 静态资源直读（nginx 直接出，绕过 app，性能更好）
      - ${UPLOAD_DATA_DIR:-/data/fitcoach/uploads}:/usr/share/nginx/uploads:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fitcoach-net

networks:
  fitcoach-net:
    driver: bridge
