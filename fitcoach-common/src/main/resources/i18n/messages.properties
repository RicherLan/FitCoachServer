# ============================================================
# FitCoach Server i18n - 简体中文（默认 / 兜底）
#
# 文件命名约定：
#   messages.properties        — defaultLocale 兜底（本文件，等同 zh_CN）
#   messages_en.properties     — 英文
#   messages_fr.properties     — 法语
#   messages_ja.properties     — 日语
#   messages_ko.properties     — 韩语
#   messages_ru.properties     — 俄语
#   messages_es.properties     — 西班牙语
#
# 编码：UTF-8（由 I18nConfig.setDefaultEncoding("UTF-8") 保证）
# Key 命名：模块前缀.具体语义（蛇形小写），与 ResultCode 枚举一一对应
# 占位符：MessageFormat 语法 {0}/{1}/...，BusinessException(rc, args...) 传入
# ============================================================

