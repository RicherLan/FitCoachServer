server:
  port: 8080
  tomcat:
    connection-timeout: 300000      # 5 分钟（毫秒），支持大文件上传

spring:
  application:
    name: fitcoach-server

  profiles:
    active: dev

  # JPA 通用配置
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # MVC：404 抛 NoHandlerFoundException，让 GlobalExceptionHandler 能统一接住
  # （否则会直接走 Spring 默认 /error 页面，丢失 traceId / 业务 Result 格式）
  # 注意：保留默认静态资源映射（add-mappings=true），项目自己注册的 /static/**
  # 上传文件目录不能被关掉；这里只控制"动态 controller 路由"的 404 行为。
  mvc:
    throw-exception-if-no-handler-found: true

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Multipart 上传
  # - 反馈附件 / 头像走小图：客户端压到 ~1MB；
  # - 日志 zip：单包最大 50MB（log-pull.max-upload-size-bytes 兜底校验）。
  # - 安装包 APK/IPA：最大 200MB（appversion.package-max-size-bytes 兜底校验）。
  # 这里取所有上传场景的最大值 200MB + buffer。
  servlet:
    multipart:
      enabled: true
      max-file-size: 210MB
      max-request-size: 210MB

# ====== 文件上传 ======
# 头像等用户上传文件存盘根目录；可通过环境变量覆盖到挂载盘 / OSS 同步目录。
# url-prefix 是返回给客户端的可访问 URL 前缀。
# 默认用相对路径 /static，让客户端按自己的 baseURL 拼接成完整 URL，
# 这样不会受"模拟器访问宿主机得用 10.0.2.2 而不是 localhost"这类网络拓扑差异影响。
# 后期切 OSS 时把 UPLOAD_URL_PREFIX 设为 https://cdn.example.com 即可，业务代码不变。
upload:
  base-dir: ${UPLOAD_BASE_DIR:./uploads}
  url-prefix: ${UPLOAD_URL_PREFIX:/static}
  # 默认头像 — 新用户（手机号 / 微信无头像）兜底使用。
  # 走 /assets/** 走 classpath 资源映射，与 /static/** 上传目录隔离，
  # 升级 / 替换默认头像只需重发包，不会覆盖用户已上传的头像。
  default-avatar-url: ${UPLOAD_DEFAULT_AVATAR_URL:/assets/default-avatar.svg}
  avatar:
    sub-dir: avatar
    max-size-bytes: 2097152                           # 2MB（客户端压缩后留 buffer）
    allowed-content-types: image/jpeg,image/png,image/webp
  feedback:
    sub-dir: feedback
    max-size-bytes: 1048576                           # 1MB / 张（客户端压缩到 1280x1280 q=0.7）
    max-attachment-count: 5                           # 单条反馈最多 5 张
  appversion:
    sub-dir: appversion
    package-max-size-bytes: 209715200                 # 200MB（APK/IPA 通常 50-200MB）
    mapping-max-size-bytes: 104857600                 # 100MB（ProGuard/R8 mapping 文件）
    max-content-length: 1000                          # 正文最长 1000 字
    allowed-content-types: image/jpeg,image/png,image/webp
  # 训练动作自定义图标 - admin 在「训练动作库」编辑页上传，客户端 iconUrl 优先于 emoji
  training-exercise-icon:
    sub-dir: trainingexercise-icon
    max-size-bytes: 524288                            # 512KB（64x64/128x128 小图够用）
    allowed-content-types: image/jpeg,image/png,image/webp

# ====== 客户端日志拉取（fitcoach-log） ======
# admin 后台触发 → 客户端 120s 轮询 pending → 打包 zip 上传 → admin 下载排查
# 三类调度任务（UPLOADING 超时回滚 / PENDING 24h 标 EXPIRED / UPLOADED 7 天清盘）共用一个间隔
log-pull:
  sub-dir: logs                                       # 日志 zip 在 upload.base-dir 下的子目录
  max-upload-size-bytes: 52428800                     # 50MB / 包，超过直接拒
  pending-expire-hours: 24                            # PENDING 任务硬过期时长
  uploading-timeout-minutes: 5                        # UPLOADING 超时回滚阈值
  uploaded-retention-days: 7                          # UPLOADED 文件保留天数
  max-retry-count: 3                                  # 单任务重试上限（含首次）
  scheduler-interval-seconds: 60                      # 调度器扫描间隔
  max-active-task-per-uid-in-24h: 1                   # 同 uid 24h 内并发任务上限（admin 创建去重）

# ====== 短信服务 ======
# provider 取值：
#   mock    → 不真发，OTP 打日志（开发期默认）
#   tencent → 调腾讯云 SMS（生产）
sms:
  provider: ${SMS_PROVIDER:mock}
  tencent:
    secret-id:   ${TENCENT_SECRET_ID:}
    secret-key:  ${TENCENT_SECRET_KEY:}
    sdk-app-id:  ${TENCENT_SMS_APP_ID:}
    template-id: ${TENCENT_SMS_TEMPLATE_ID:}
    sign-name:   ${TENCENT_SMS_SIGN_NAME:FitCoach}
    region:      ${TENCENT_SMS_REGION:ap-guangzhou}

# ====== OTP 验证码策略 ======
otp:
  length: 6
  ttl-seconds: 300                   # OTP 有效期 5 分钟
  resend-cooldown-seconds: 60        # 同一手机号重发冷却
  max-per-hour-per-phone: 5          # 同一手机号 1 小时最多发 5 条
  max-per-hour-per-ip: 20            # 同一 IP 1 小时最多发 20 条
  max-verify-attempts: 5             # 单条 OTP 最多校验 5 次错误后立即作废

# ====== 腾讯行为验证码（CAPTCHA） ======
# enabled=false → 跳过校验（本地开发默认关闭，生产打开）
# app-id / app-secret-key → 腾讯云验证码控制台获取
captcha:
  enabled: ${CAPTCHA_ENABLED:false}
  app-id: ${CAPTCHA_APP_ID:199923205}
  app-secret-key: ${CAPTCHA_APP_SECRET_KEY:oCscE3Kf2mIvFLrJhgEHC7Qss}

# ====== OpenAPI / Swagger 文档（springdoc-openapi） ======
# 默认开启（dev 环境），生产建议在 application-prod.yml 关掉或加 Basic Auth。
# 入口：
#   - Swagger UI:  http://host:port/swagger-ui.html
#   - JSON 文档：  http://host:port/v3/api-docs            （全部）
#                 http://host:port/v3/api-docs/admin      （Admin 后台分组）
#                 http://host:port/v3/api-docs/client     （App 客户端分组）
# 注意：springdoc 自身路径 /swagger-ui/** /v3/api-docs/** 不在 /api/** 命名空间下，
# 不会被 ClientInfoInterceptor / AdminAuthInterceptor 拦截，无需额外放行。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 按 HTTP 方法排序更直观（GET → POST → PUT → DELETE）
    operations-sorter: method
    tags-sorter: alpha
    # 默认折叠，避免 controller 多时一开页一片混乱
    doc-expansion: none
    # 持久化 Authorize 输入的 token 到 localStorage，刷新页面不丢
    persist-authorization: true
  # 不把 Spring Boot Actuator / 内置错误端点暴露到文档中
  paths-to-exclude:
    - /error
    - /actuator/**

# ====== 后台管理（fitcoach-admin） ======
# 管理员 token 过期时间默认 8h（比客户端 access token 2h 更长 —— 后台操作场景一次登录工作半天）。
# 该配置存放在 sys_config.admin.token_expire_hours，本文件不直接配置；
# 默认账号（首次启动自动创建）：username=admin / password=admin123，
# 生产环境请立即登录后台修改密码！

# 日志
# pattern 里 %X{traceId} 取自 SLF4J MDC，由 TraceIdFilter 在请求入口注入。
# 非请求线程（如 @Scheduled / @Async / 启动期）MDC 为空，pattern 输出 "-" 占位。
logging:
  level:
    root: INFO
    com.lanprojects.fitcoach: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:--}] %logger{36} - %msg%n"
