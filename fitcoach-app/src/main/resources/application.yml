server:
  port: 8080

spring:
  application:
    name: fitcoach-server

  profiles:
    active: dev

  # JPA 通用配置
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# 日志
logging:
  level:
    root: INFO
    com.lanprojects.fitcoach: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
